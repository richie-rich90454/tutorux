[package]
name = "tutorux-audio-helper"
version = "1.0.0"
description = "Standalone native audio capture helper for Tutorux CLI recording"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tutorux-archive-lock = { path = "../native-archive-lock" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
flexaudio = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = {
    version = "0.18.2",
    default-features = false,
    features = ["pipewire"],
}

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.1", features = ["macos_14_0"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
