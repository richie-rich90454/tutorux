
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="96"
    height="96"
    viewBox="0 0 96 96"
    role="img"
    aria-labelledby="tutorux-title tutorux-description"
>
    <title id="tutorux-title">Tutorux</title>
    <desc id="tutorux-description">
        A session folio connecting an audio waveform to written notes,
        marked by a recording signal.
    </desc>

    <!-- Archival green: the Tutorux brand color. -->
    <rect
        width="96"
        height="96"
        rx="20"
        fill="#315B4A"
    />

    <!-- One connected folio, representing the complete session record. -->
    <path
        d="
            M20 30.5
            C20 26.91 22.91 24 26.5 24
            H41.5
            C44.1 24 46.4 25 48 27.1
            C49.6 25 51.9 24 54.5 24
            H69.5
            C73.09 24 76 26.91 76 30.5
            V61.5
            C76 65.09 73.09 68 69.5 68
            H54.5
            C51.9 68 49.7 69.1 48 71
            C46.3 69.1 44.1 68 41.5 68
            H26.5
            C22.91 68 20 65.09 20 61.5
            Z
        "
        fill="#FFFFFF"
    />

    <!-- The center seam connects the two parts of the record. -->
    <path
        d="M48 30.5V63.5"
        fill="none"
        stroke="#315B4A"
        stroke-width="2.5"
        stroke-linecap="round"
    />

    <!-- Left page: the shape of recorded speech. -->
    <path
        d="
            M26 47
            C28 47 28 41 30 41
            S32 54 34 54
            S36 36 38 36
            S40 50 42 50
            S44 45 46 45
        "
        fill="none"
        stroke="#315B4A"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Right page: transcript and organized notes. -->
    <g fill="#315B4A">
        <rect x="54" y="36" width="14" height="3" rx="1.5"/>
        <rect x="54" y="44" width="17" height="3" rx="1.5"/>
        <rect x="54" y="52" width="12" height="3" rx="1.5"/>
    </g>

    <!-- Live-capture indicator: the sole bright accent. -->
    <circle
        cx="73"
        cy="20"
        r="5.5"
        fill="#E34D47"
        stroke="#315B4A"
        stroke-width="2.5"
    />
</svg>
