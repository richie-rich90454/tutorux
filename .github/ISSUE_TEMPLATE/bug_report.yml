name: Bug report
description: Report a reproducible problem in Tutorux
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove student data, recordings, transcripts, credentials, and workspace files before attaching anything.
        For security issues, use the private advisory link instead.
  - type: input
    id: version
    attributes:
      label: Tutorux version
      description: The release version or commit hash.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Build
      options:
        - MSI installer
        - NSIS setup
        - Portable EXE
        - Development build
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence that reliably triggers the problem.
      placeholder: |
        1. Open ...
        2. Create ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text and whether it is reproducible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove private lesson data and credentials first.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed student data, recordings, transcripts, credentials, and private workspace content.
          required: true
