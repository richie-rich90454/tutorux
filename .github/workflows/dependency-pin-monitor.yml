name: FetchContent pin monitor

on:
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetchcontent-pin-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream pins and releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake FetchContent pins
        run: python3 cmake/CheckFetchContentPins.py
