name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows x64 build, tests, and budgets
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSYS2 UCRT64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-alsa-lib

      - name: Install Rust GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu

      - name: Configure developer build
        shell: msys2 {0}
        run: cmake --preset dev

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/dev -j 4

      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build/dev --output-on-failure -j 4

      - name: Check size budget
        shell: msys2 {0}
        run: cmake --build build/dev --target size

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: build/dev/size-report.txt
          if-no-files-found: ignore
