name: TypeScript and Tauri cross-platform checks

on:
    push:
        branches: [main, tauri-rewrite]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tauri-cross-platform-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: ${{ matrix.os }} · web and desktop
        runs-on: ${{ matrix.os }}
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                # macOS 26 supplies the Metal SDK required by screencapturekit's
                # Swift bridge; the packaged app still targets macOS 14.
                os: [windows-2025, macos-26, ubuntu-24.04]

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Require signing credentials for tagged releases
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
              run: |
                  if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
                    echo "::error::A macOS release tag requires APPLE_CERTIFICATE and notarization secrets."
                    exit 1
                  fi
                  if [ "$RUNNER_OS" = "Windows" ] && [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
                    echo "::error::A Windows release tag requires WINDOWS_CERTIFICATE and its password."
                    exit 1
                  fi

            - name: Install Linux desktop libraries
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes \
                    build-essential curl file libayatana-appindicator3-dev libssl-dev \
                    libasound2-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
                    libxdo-dev patchelf xdg-utils

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: |
                      src-tauri -> target

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch the PDFium runtime
              run: pnpm run pdfium:fetch

            - name: Audit dependencies
              run: pnpm audit --audit-level high

            - name: Verify the TypeScript CLI stays retired
              shell: bash
              run: |
                  if [ -d cli ]; then
                    echo "::error::The TypeScript CLI directory must not return."
                    exit 1
                  fi
                  if grep -q '"cli":' package.json; then
                    echo "::error::The TypeScript CLI script must not return."
                    exit 1
                  fi

            - name: Verify application version consistency
              run: node scripts/collect-release.mjs --check-versions

            - name: Type check
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Check formatting
              run: pnpm run format:check

            - name: Unit tests
              run: pnpm test

            # The Tauri custom-protocol feature embeds dist/, so build it before
            # Clippy runs with --all-features.
            - name: Build desktop frontend
              run: pnpm run build

            - name: Check Rust formatting
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

            - name: Lint Rust
              run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

            - name: Rust core and desktop tests
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml

            - name: Import Windows signing certificate
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: |
                  if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
                  $pfxPath = Join-Path $env:RUNNER_TEMP "tutorux-signing.pfx"
                  [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
                  $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
                  $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
                  "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
                  Remove-Item $pfxPath -Force

            # Tagged releases require the signing secrets; branch and PR builds may
            # produce unsigned smoke-test packages.
            - name: Build native desktop package
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: pnpm run desktop:build

            - name: Archive macOS app bundle
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  find release -maxdepth 1 -name '*.app' -print0 | while IFS= read -r -d '' app; do
                    tar -czf "${app}.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
                    rm -rf "$app"
                  done

            - name: Report signing configuration
              shell: bash
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
              run: |
                  if [ -z "${APPLE_CERTIFICATE:-}" ] && [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
                    echo "::notice::Signing and notarization secrets are absent; release artifacts are unsigned."
                  else
                    echo "::notice::Signing secrets are present; the Tauri bundler signs during the desktop build."
                  fi

            - name: Write SHA-256 checksums
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  Get-ChildItem release -File |
                    Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
                    ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
                    Set-Content release/SHA256SUMS.txt -Encoding ascii

            - name: Write SHA-256 checksums
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  cd release
                  find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sh -c '
                    if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi
                  ' _ {} \; | sed 's|  \./|  |' | sort -k2 > SHA256SUMS.txt

            - name: Upload desktop bundles
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: tutorux-${{ matrix.os }}
                  path: release/**
                  if-no-files-found: error
