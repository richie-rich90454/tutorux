[package]
name = "tutorux-desktop"
version = "1.0.0"
description = "Tutorux desktop host"
authors = ["Tutorux"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2.5.4"
keyring = "4.2.0"
llama-cpp-2 = "=0.1.160"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
encoding_rs = "0.8.35"
whisper-rs = { version = "=0.16.0", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
